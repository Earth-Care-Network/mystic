# Mystic's release: a signed build for Mac (universal), Windows and Linux,
# published as a draft GitHub release with the updater feed (latest.json) every
# installed Mystic checks at launch.
#
# Runs only on a tag `v*` (tags are admin-only by ruleset) and only after an admin
# approves the `release` environment, which alone holds the signing secrets:
#   TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD)  the updater signing key
#   APPLE_*                                  Developer ID + notarization (when set)
name: release
# No manual dispatch: a release is only ever a `v*` tag, never a branch.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run test
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mystic ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md.
          releaseDraft: true
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
      # The one-line installer and the site download a stable name and check it
      # against SHA256SUMS.txt from the same release.
      - name: Mac download and checksums
        if: matrix.platform == 'macos-15'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          cp "$dmg" Mystic.dmg
          shasum -a 256 Mystic.dmg > SHA256SUMS.txt
          codesign --verify --deep --strict --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/Mystic.app
          gh release upload "$TAG" Mystic.dmg SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
