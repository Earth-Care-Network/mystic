[package]
name = "mystic"
version = "0.1.0"
description = "Mystic by Earth Care Network"
authors = ["Earth Care Network"]
license = "MIT"
edition = "2021"

[lib]
name = "mystic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
dirs = "7.0.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-http = "2.8.3"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
url = "2.5.8"
